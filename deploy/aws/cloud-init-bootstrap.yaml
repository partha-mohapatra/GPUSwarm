#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl-minimal

users:
  - name: infermesh
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/infermeshai

write_files:
  - path: /etc/infermeshai/config.yaml
    owner: root:infermesh
    permissions: '0640'
    content: |
      mode: client
      transport: libp2p
      client_name: aws-bootstrap
      provider_name: aws-bootstrap
      identity_file: /var/lib/infermeshai/infermeshd.identity.pem
      client_addr: :5555
      provider_addr: :7777
      provider_peer_urls: []
      backend_kind: openai
      backend_url: http://127.0.0.1:9000
      peer_id: ""
      gpu: bootstrap-node
      vram_free_mb: 0
      models: []
      model_specs: []
      advertise_url: ""
      max_inflight: 1
      rate_per_second: 10
      burst: 10
      max_tokens_per_request: 0
      night_only: false
      night_start_hour: 22
      night_end_hour: 6
      idle_only: false
      max_load1m: 2
      pow_difficulty: 0
      min_peer_reputation: 0
      initial_credits: 0
      routing_policy: auto
      favorite_peers: []
      blocked_peers: []
      allowed_peers: []
      sticky_peer_ttl: 0s
      weight_latency: 1
      weight_queue_depth: 2
      weight_vram_pressure: 500
      weight_reliability: 100
      weight_favorite_bonus: 10
      weight_known_bonus: 3
      lan_discovery: false
      lan_listen_addr: :9559
      lan_broadcast_addr: 255.255.255.255:9559
      lan_announce_interval: 3s
      lan_peer_ttl: 15s
      libp2p_listen_addrs:
        - /ip4/0.0.0.0/tcp/39001
      libp2p_bootstrap_peers: []
      libp2p_rendezvous: infermesh-rendezvous
      libp2p_auto_relay: true
      libp2p_relay_service: true
      libp2p_nat_port_map: true
      libp2p_hole_punching: true
      request_timeout: 5m
      log_file: /var/log/infermeshai/infermeshd.log
  - path: /etc/systemd/system/infermeshd.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=infermeshAI daemon
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=infermesh
      Group=infermesh
      WorkingDirectory=/opt/infermeshai
      ExecStart=/opt/infermeshai/infermeshd-linux-amd64 -config /etc/infermeshai/config.yaml
      Restart=always
      RestartSec=3
      LimitNOFILE=65535

      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /opt/infermeshai /var/lib/infermeshai /var/log/infermeshai /etc/infermeshai
  - chown -R infermesh:infermesh /var/lib/infermeshai /var/log/infermeshai
  - curl -fsSL -o /opt/infermeshai/infermeshd-linux-amd64 https://YOUR_ARTIFACT_HOST/infermeshd-linux-amd64
  - chmod +x /opt/infermeshai/infermeshd-linux-amd64
  - systemctl daemon-reload
  - systemctl enable infermeshd
  - systemctl restart infermeshd
